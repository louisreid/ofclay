<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Of Clay</title>
    <meta
      name="description"
      content="Of Clay — photography and creative studio. Portfolio forming."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="fold">
      <header class="brand">
        <p class="brand__name">Of Clay</p>
        <p class="brand__note">Photography</p>
      </header>

      <main class="portfolio" aria-label="Selected studies">
        <figure class="study study--light">
          <div class="study__image" role="img" aria-label="Abstract study of soft window light"></div>
        </figure>
        <figure class="study study--horizon">
          <div class="study__image" role="img" aria-label="Abstract study of a quiet horizon"></div>
        </figure>
        <figure class="study study--grain">
          <div class="study__image" role="img" aria-label="Abstract study of clay texture"></div>
        </figure>
      </main>
    </div>

    <footer class="contact">
      <p class="contact__lede">Enquiries</p>
      <a class="contact__email" href="mailto:info@ofclay.co">info@ofclay.co</a>

      <form
        class="enquiry"
        action="https://formsubmit.co/info@ofclay.co"
        method="POST"
      >
        <input type="hidden" name="_subject" value="Of Clay enquiry" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" />

        <label class="field">
          <span>Name</span>
          <input type="text" name="name" required autocomplete="name" />
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label class="field field--message">
          <span>Message</span>
          <textarea name="message" rows="3" required></textarea>
        </label>
        <button type="submit">Send</button>
      </form>
    </footer>
  </body>
</html>
