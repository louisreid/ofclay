<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>of clay</title>
    <meta
      name="description"
      content="of clay — photography and creative studio."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <span class="atmosphere__wash"></span>
      <span class="atmosphere__plane"></span>
      <span class="atmosphere__grain"></span>
    </div>

    <div class="fold">
      <header class="brand">
        <p class="brand__name">of clay</p>
      </header>

      <main class="cluster" aria-label="Selected photographs">
        <div class="cluster__row cluster__row--top">
          <button
            type="button"
            class="study study--side"
            data-full="/images/01-on-top-lg.jpg"
            aria-label="Open photograph"
          >
            <img
              src="/images/01-on-top-md.jpg"
              alt=""
              width="900"
              height="600"
              loading="eager"
              decoding="async"
            />
          </button>

          <button
            type="button"
            class="study study--center"
            data-full="/images/05-img-lg.jpg"
            aria-label="Open photograph"
          >
            <img
              src="/images/05-img-md.jpg"
              alt=""
              width="600"
              height="900"
              loading="eager"
              decoding="async"
            />
          </button>

          <button
            type="button"
            class="study study--side"
            data-full="/images/04-lars-josefin-lg.jpg"
            aria-label="Open photograph"
          >
            <img
              src="/images/04-lars-josefin-md.jpg"
              alt=""
              width="900"
              height="600"
              loading="eager"
              decoding="async"
            />
          </button>
        </div>

        <div class="cluster__row cluster__row--bottom">
          <button
            type="button"
            class="study study--base"
            data-full="/images/02-dsc-lg.jpg"
            aria-label="Open photograph"
          >
            <img
              src="/images/02-dsc-md.jpg"
              alt=""
              width="900"
              height="604"
              loading="lazy"
              decoding="async"
            />
          </button>
        </div>
      </main>
    </div>

    <footer class="contact">
      <p class="contact__lede">Enquiries</p>
      <a class="contact__email" href="mailto:info@ofclay.co">info@ofclay.co</a>

      <form
        class="enquiry"
        action="https://formsubmit.co/info@ofclay.co"
        method="POST"
      >
        <input type="hidden" name="_subject" value="Of Clay enquiry" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" />

        <label class="field">
          <span>Name</span>
          <input type="text" name="name" required autocomplete="name" />
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label class="field field--message">
          <span>Message</span>
          <textarea name="message" rows="3" required></textarea>
        </label>
        <button type="submit">Send</button>
      </form>
    </footer>

    <div class="lightbox" hidden>
      <button type="button" class="lightbox__backdrop" aria-label="Close"></button>
      <img class="lightbox__image" alt="" />
    </div>

    <script src="/lightbox.js" defer></script>
  </body>
</html>
